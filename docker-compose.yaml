services:
  database:
    image: postgres:18 
    container_name: dog-database 
    restart: unless-stopped 

    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: ${DB_PASSWORD} 
      POSTGRES_DB: dog_territory 
    
    ports:
     - "5433:5432" 
    
    volumes :
     - dog_postgres_data:/var/lib/postgresql 
    
    healthcheck:
      test: ['CMD-SHELL' , 'pg_isready -U postgres -d dog_territory'] 
      interval: 5s 
      timeout: 5s 
      retries: 5

  backend :
    build:
        context: ./backend
        dockerfile: Dockerfile
        image: tharnishpalanisamy/dog-territory-backend:1.1
    image: tharnishpalanisamy/dog-territory-backend:1.0 
    container_name: dog-backend
    restart: unless-stopped 
    



    env_file: 
      - ./backend/.env 
    
    environment:
      DB_HOST: database 
      DB_PORT: 5432 
    
    ports:
      - "8000:8000" 
    
    volumes:
      - dog_uploads:/app/uploads 
      - dog_logs:/app/logs
    depends_on:
      database: 
       condition: service_healthy
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      image: tharnishpalanisamy/dog-territory-frontend:1.4
    image: tharnishpalanisamy/dog-territory-frontend:1.3 
    container_name: dog-frontend 
    restart: unless-stopped 

    environment:
      API_URL: http://127.0.0.1:8000/api/v1 
    
    ports:
      - "5173:80" 
    
    depends_on:
      - backend

volumes:
  dog_postgres_data:
    external: true 
  dog_uploads:
    external: true 
  dog_logs:
    external: true 
